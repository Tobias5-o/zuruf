<!-- Zuruf: Anmelde-E-Mail mit Code statt Link (kein Link, damit sich das Handy nicht in den Browser statt in die App verirrt). -->
<div style="font-family: sans-serif; color: #2C393B; padding: 24px;">
  <p style="font-size: 16px; margin: 0 0 20px;">Dein Anmeldecode für Zuruf:</p>
  <p style="font-size: 36px; font-weight: 700; letter-spacing: 0.15em; margin: 0 0 20px;">{{ .Token }}</p>
  <p style="font-size: 14px; color: #6b6b6b; margin: 0;">Gib diesen Code in der Zuruf-App ein. Der Code läuft nach kurzer Zeit ab. Wenn du dich nicht angemeldet hast, ignoriere diese E-Mail.</p>
</div>
